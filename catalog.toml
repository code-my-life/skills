# Catalogue des skills de Code My Life (hermes-software-factory#37, skills#3).
#
# origine : maison (écrite ici), amont (copie figée d'un autre dépôt, table amont), npm (paquet npm, table npm) ou
#   projet (skill propre à un autre dépôt de code-my-life, table projet). copie = false : la skill n'est que déclarée,
#   et s'installe depuis son amont.
# consommateurs : operateur (séances de Claude Code), lane-claude et lane-opencode (lanes de la factory),
#   hermes:<profil>, projet:<propriétaire/dépôt>. Claude Code et OpenCode lisent ~/.claude/skills : une skill de
#   l'opérateur qui se déclenche seule y est vue aussi par les lanes Claude Code.
#   Le profil racine (hermes:default) ne reçoit plus les skills d'Emil Kowalski depuis le 2026-11-06, en attendant
#   la décision du propriétaire (#5).
# declenchement : manuel (jamais par le modèle), auto (le modèle la prend), carte (préchargée par la carte).
# Renovate lit les versions figées : garder les lignes depot, ref (puis branche) et paquet, version l'une après
# l'autre.

